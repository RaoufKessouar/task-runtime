name: Routine

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the current time slot was already completed
        type: boolean
        default: false
  schedule:
    - cron: '*/10 6-21 * * *'
      timezone: Europe/Paris

permissions:
  contents: read

concurrency:
  group: routine
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Window
        id: window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_SCAN: ${{ inputs.force }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_SCAN" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hour="$(TZ=Europe/Paris date +%H)"
          local_minute="$(TZ=Europe/Paris date +%M)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$((10#$local_minute % 10))" -ne 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Outside the automatic time slot."
            exit 0
          fi
          if [ "$((10#$local_hour))" -ge 6 ] && [ "$((10#$local_hour))" -le 21 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Outside the configured window."
          fi

      - name: Load
        if: steps.window.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CONFIG_A }}
          token: ${{ secrets.CONFIG_B }}
          path: source
          fetch-depth: 0

      - name: Runtime
        if: steps.window.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Prepare
        if: steps.window.outputs.enabled == 'true'
        working-directory: source
        run: bash .github/runtime.sh prepare

      - name: Execute
        if: steps.window.outputs.enabled == 'true'
        working-directory: source
        env:
          CONFIG_C: ${{ secrets.CONFIG_C }}
          CONFIG_D: ${{ secrets.CONFIG_D }}
          CONFIG_E: ${{ secrets.CONFIG_E }}
          CONFIG_F: ${{ secrets.CONFIG_F }}
          CONFIG_G: ${{ secrets.CONFIG_G }}
          STAGE_RADAR_FORCE_SCAN: ${{ inputs.force }}
        run: bash .github/runtime.sh execute

      - name: Finalize
        if: always() && steps.window.outputs.enabled == 'true'
        working-directory: source
        run: bash .github/runtime.sh finalize
