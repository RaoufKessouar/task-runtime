name: Temporary mail delivery check
on:
  workflow_dispatch:
    inputs:
      expect_same_address:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check configured mail delivery
        env:
          SMTP_USER: ${{ secrets.CONFIG_D }}
          SMTP_PASSWORD: ${{ secrets.CONFIG_E }}
          NOTIFY_TO: ${{ secrets.CONFIG_F }}
          EXPECT_SAME_ADDRESS: ${{ inputs.expect_same_address }}
        run: |
          python3 - <<'PY'
          import os,smtplib
          from email.message import EmailMessage
          sender=os.environ['SMTP_USER'].strip()
          recipient=os.environ['NOTIFY_TO'].strip()
          if os.environ['EXPECT_SAME_ADDRESS']=='true' and sender!=recipient:
              raise RuntimeError('Sender and recipient are not aligned')
          msg=EmailMessage()
          msg['Subject']='[JR] Test de centralisation '+os.environ['GITHUB_RUN_ID']
          msg['From']=sender
          msg['To']=recipient
          msg.set_content('JR : test de reception des notifications dans la boite dediee. Aucun changement des offres ou des candidatures.')
          with smtplib.SMTP_SSL('smtp.gmail.com',465,timeout=30) as smtp:
              smtp.login(sender,os.environ['SMTP_PASSWORD'].replace(' ',''))
              if smtp.send_message(msg): raise RuntimeError('Recipient refused')
          print('SMTP authenticated; one test notification accepted')
          PY
