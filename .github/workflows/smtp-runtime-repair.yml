name: Temporary SMTP runtime verification
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify active sender and send one test notification
        shell: bash
        env:
          SMTP_USER: ${{ secrets.CONFIG_D }}
          SMTP_PASSWORD: ${{ secrets.CONFIG_E }}
          NOTIFY_TO: ${{ secrets.CONFIG_F }}
        run: |
          python3 - <<'PY'
          import os, smtplib
          from email.message import EmailMessage

          user = os.environ["SMTP_USER"].strip()
          password = os.environ["SMTP_PASSWORD"].replace(" ", "")
          recipient = os.environ["NOTIFY_TO"].strip()
          assert user == "raouf.kessouar168@gmail.com", "Runtime sender was not updated"
          assert recipient == "abderaoufkessouar@gmail.com", "Runtime recipient was changed unexpectedly"
          message = EmailMessage()
          message["Subject"] = "✅ Stage Radar: expéditeur corrigé"
          message["From"] = user
          message["To"] = recipient
          message.set_content("Le dépôt qui exécute les scans réguliers utilise désormais raouf.kessouar168@gmail.com pour envoyer les alertes vers abderaoufkessouar@gmail.com. Cet email de test confirme que la configuration SMTP fonctionne.")
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(user, password)
              refused = smtp.send_message(message)
              assert not refused, "Recipient refused"
          print("Active runtime SMTP sender and recipient verified; test message accepted")
          PY
